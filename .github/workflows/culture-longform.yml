# 세계 문화 상식 쇼츠 (@gonmauY) - 롱폼 만들기 (쇼츠 여러 개를 묶어 가로 영상 1개)
#
# 쇼츠 파이프라인과 별도 액션입니다. facts_db.json 은 바꿔서 커밋하지 않고, 기록은 longform_db.json 에만 남깁니다.
#
#   mode = auto   : 영상이 끝난 소재 중 아직 롱폼에 안 쓴 것을 번호순으로 count개 (theme으로 분야/나라/주제 키워드 지정 가능)
#   mode = manual : indexes 에 적은 번호들을 묶음 (예: 109,110,115-118)
#   개수는 3~30개, 전체 예상 길이 40분 이하
#   preview = list/script/images/voice : 영상 없이 한 단계만 먼저 확인 (결과는 디스코드). 대본은 저장되어 이후 영상 제작에 그대로 쓰임
#   dry_run = true : preview list 와 같음 (예전 방식)
#
# 결과: 아티팩트(longform_out)에 mp4 / 썸네일 / 제목+설명(챕터 포함). 디스코드로 제목/설명/썸네일 전송. 업로드는 직접.

name: culture-longform

on:
  schedule:
    - cron: "0 11 * * 6"   # UTC 기준 (한국 시간 = UTC+9)
  workflow_dispatch:
    inputs:
      mode:
        description: "선택 방식 (auto=자동, manual=번호 직접)"
        type: choice
        options: [auto, manual]
        default: auto
      indexes:
        description: "manual일 때 묶을 번호 (예: 109,110,115-118 / 3~30개)"
        default: ""
      theme:
        description: "auto일 때 분야/나라/주제 키워드 (비우면 번호순)"
        default: ""
      count:
        description: "auto일 때 묶을 개수 (3~30)"
        default: "6"
      start_index:
        description: "auto일 때 이 번호 이상만 후보"
        default: "106"
      title:
        description: "롱폼 제목 (비우면 자동)"
        default: ""
      preview:
        description: "영상 만들기 전 한 단계만 미리 보기 (off=영상까지 / list=목록 / script=대본·시나리오 / images=장면 사진 / voice=대본+음성 / cuts=컷 시트+후보 사진) - 결과는 디스코드로"
        type: choice
        options: ["off", list, script, images, voice, cuts]
        default: "off"
      pick:
        description: "후보 사진 고르기 (cuts 결과의 번호. 예: 117_3=2, 118_1=5 / 비우면 안 함). 고른 사진은 my_images에 저장되어 계속 쓰임"
        default: ""
      dry_run:
        description: "(예전 방식) 목록만 보기 = preview list 와 같음"
        type: boolean
        default: false
      fill_images:
        description: "빠진 사진은 Pixabay에서 받아 채우기 (GitHub에는 PC 사진이 없어서 켜 두는 것을 권장)"
        type: boolean
        default: true
      clips:
        description: "스톡 짧은 영상(Pixabay/Pexels)을 일부 장면에 사용 (시간·용량 늘어남)"
        type: boolean
        default: false

      recap:
        description: "롱폼 마지막에 요약 화면 + 엔딩 멘트 넣기 (끄면 마지막 챕터에서 바로 끝)"
        type: boolean
        default: true
      recap_cards:
        description: "요약 화면의 챕터별 요약 카드 표시 (끄면 엔딩 멘트 음성만. recap을 끄면 무관)"
        type: boolean
        default: true
      deep:
        description: "심층편 (manual + 번호 1개: 그 소재 하나를 소주제 여러 개로 나눠 긴 영상 1편으로)"
        type: boolean
        default: false
      sections:
        description: "심층편 소주제 개수 (3~8)"
        default: "5"
      minutes:
        description: "심층편 목표 길이 분 (5~12)"
        default: "8"

      cross_check:
        description: "대본 교차검증 (위키 근거 + 다른 모델 검증, 토큰 많이 씀. 기본 끔 - 직접 검증한 대본을 쓰는 방식)"
        type: boolean
        default: false

      voice:
        description: "목소리 (Supertonic: F1~F5 여성, M1~M5 남성 / 비우면 기본 F1)"
        default: ""
      speed:
        description: "말 속도 (예: -5% / +10% / 비우면 기본)"
        default: ""
      caption_mode:
        description: "자막 방식 (script=대본 자막 입힘, highlight=핵심 문구 표시(롱폼은 대본 자막), srt=SRT 파일만(영상엔 자막 없음), both=대본 자막+SRT)"
        type: choice
        options: [script, highlight, srt, both]
        default: script

permissions:
  contents: write

jobs:
  longform:
    if: ${{ github.event_name != 'schedule' || vars.AUTO_RUN != 'off' }}   # 저장소 변수 AUTO_RUN=off 로 자동 실행 일시 중지
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      LF_RECAP_CARDS: ${{ github.event.inputs.recap_cards == 'false' && '0' || '1' }}
      LF_RECAP: ${{ github.event.inputs.recap == 'false' && '0' || '1' }}
      DEEPARGS: ${{ github.event.inputs.deep == 'true' && format('--deep --sections {0} --minutes {1}', github.event.inputs.sections || '5', github.event.inputs.minutes || '8') || '' }}
      CROSS_CHECK: ${{ github.event.inputs.cross_check == 'true' && '1' || '0' }}
      PYTHONUNBUFFERED: "1"
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}   # 롱폼 확장 대본/교차검증용
      LF_FILL_IMAGES: ${{ github.event.inputs.fill_images == 'false' && '0' || '1' }}
      LF_CLIPS: ${{ github.event.inputs.clips == 'true' && '1' || '0' }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      SUPERTONIC_VOICE_KO: ${{ github.event.inputs.voice || '' }}
      CAPTION_MODE: ${{ github.event.inputs.caption_mode || 'script' }}
      TTS_RATE: ${{ github.event.inputs.speed || '' }}
      GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      MODE: ${{ github.event.inputs.mode || 'auto' }}
      INDEXES: ${{ github.event.inputs.indexes || '' }}
      THEME: ${{ github.event.inputs.theme || '' }}
      COUNT: ${{ github.event.inputs.count || '6' }}
      START: ${{ github.event.inputs.start_index || '106' }}
      TITLE: ${{ github.event.inputs.title || '' }}
      PICK: ${{ github.event.inputs.pick || '' }}
      PREVIEW: ${{ github.event.inputs.preview == 'off' && (github.event.inputs.dry_run == 'true' && 'list' || '') || github.event.inputs.preview }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 시스템 의존성 (ffmpeg, 한글 폰트)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - run: pip install -r requirements.txt

      - name: 고른 후보 사진 적용 (pick)
        if: ${{ env.PICK != '' }}
        run: python cuts.py --pick "$PICK"

      - name: 주제 한국어로 옮기기 (영어로 저장된 주제만)
        if: ${{ env.PREVIEW != '' && env.GROQ_API_KEY != '' }}
        continue-on-error: true
        run: python topic_ko.py --start "$START"

      - name: 단계별 미리 보기 (영상은 안 만듦)
        if: ${{ env.PREVIEW != '' }}
        run: |
          case "$PREVIEW" in
            list)   python build_longform.py --dry-run --mode "$MODE" --indexes "$INDEXES" --theme "$THEME" --count "$COUNT" --start "$START" $DEEPARGS ;;
            *)      python build_longform.py --preview "$PREVIEW" --mode "$MODE" --indexes "$INDEXES" --theme "$THEME" --count "$COUNT" --start "$START" $DEEPARGS ;;
          esac

      - name: 롱폼 만들기
        if: ${{ env.PREVIEW == '' }}
        run: |
          python build_longform.py --mode "$MODE" --indexes "$INDEXES" --theme "$THEME" --count "$COUNT" --start "$START" --title "$TITLE" $DEEPARGS --channel "${{ vars.CHANNEL_NAME || 'gonmauY' }}" --handle "${{ vars.CHANNEL_HANDLE || '@gonmauY' }}"

      # facts_db.json 은 음성/이미지 경로가 바뀌었을 수 있어도 저장하지 않는다 (longform_db.json 만 커밋)
      - name: longform_db.json 커밋
        if: ${{ env.PREVIEW == '' || env.PREVIEW == 'script' || env.PREVIEW == 'voice' || env.PREVIEW == 'images' || env.PREVIEW == 'cuts' }}
        run: |
          git checkout -- facts_db.json 2>/dev/null || true
          git config user.name "culture-shorts-bot"
          git config user.email "bot@users.noreply.github.com"
          [ -f longform_db.json ] && git add longform_db.json || true
          [ -f longform_scripts.json ] && git add longform_scripts.json || true
          [ -f deep_db.json ] && git add deep_db.json || true
          [ -f topic_ko.json ] && git add topic_ko.json || true
          [ -d my_images ] && git add my_images || true
          git diff --cached --quiet || git commit -m "chore: update longform_db.json [skip ci]"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME:-main}" && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 3
          done
          echo "push 실패"; exit 1

      - name: 구글 드라이브 저장 (롱폼)
        if: ${{ env.PREVIEW == '' }}
        continue-on-error: true
        env:
          DRIVE_CLIENT_ID: ${{ secrets.DRIVE_CLIENT_ID }}
          DRIVE_CLIENT_SECRET: ${{ secrets.DRIVE_CLIENT_SECRET }}
          DRIVE_REFRESH_TOKEN: ${{ secrets.DRIVE_REFRESH_TOKEN }}
        run: |
          if [ -n "$DRIVE_REFRESH_TOKEN" ]; then
            python drive_sync.py push --only longform
          else
            echo "DRIVE_REFRESH_TOKEN Secret이 없어 드라이브 저장을 건너뜁니다."
          fi

      - name: 롱폼 아티팩트
        id: art
        if: ${{ env.PREVIEW == '' || env.PREVIEW == 'images' || env.PREVIEW == 'voice' || env.PREVIEW == 'cuts' }}
        uses: actions/upload-artifact@v4
        with:
          name: longform
          path: longform_out/*
          retention-days: 14
          if-no-files-found: warn

      - name: 디스코드 알림
        if: ${{ always() && env.DISCORD_WEBHOOK_URL != '' }}
        env:
          JOB_STATUS: ${{ job.status }}
          PREVIEW: ${{ env.PREVIEW }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          ART_URL: ${{ steps.art.outputs.artifact-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python notify_longform.py

      # ---------- 작업 이력 (run_history.jsonl / run_history.md / history_items.csv) ----------
      - name: 작업 이력 기록
        if: ${{ always() }}
        continue-on-error: true
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python history.py add --kind "롱폼" --title "${{ github.workflow }} #${{ github.run_number }}" --status "${{ job.status }}" --detail "$RUN_URL"
          git config user.name "culture-shorts-bot"
          git config user.email "bot@users.noreply.github.com"
          echo "run_history.jsonl merge=union" >> .git/info/attributes
          git add run_history.jsonl run_history.md history_items.csv
          git diff --cached --quiet || git commit -m "chore: run history [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash -X theirs origin "${GITHUB_REF_NAME:-main}" && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 4
          done
          exit 1

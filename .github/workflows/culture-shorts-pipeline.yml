# 세계 문화 상식 쇼츠 - 클라우드 자동화 (아이폰에서 실행/검수)
#
# 아이폰: GitHub 앱(또는 Safari) > Actions > culture-shorts-pipeline > Run workflow
#
#   stage = prepare : 소재 -> 대본 -> 제목/핵심 문구/이미지 검색어 까지 만들고 review.txt 생성 (영상은 안 만듦)
#           -> 레포의 review.txt를 열어 제목/핵심 문구를 고치고 저장(Commit)
#   stage = render  : review.txt의 수정 사항을 반영해서 음성 -> 이미지 -> 영상(-> 유튜브 비공개 업로드)
#   stage = cuts    : prepare + 이미지 컷 시트/컷별 후보 사진을 디스코드로 (사진을 직접 고르고 싶을 때). 고른 번호는 pick 칸에 적고 render 실행
#   stage = all     : 위 두 단계를 한 번에 (검수 없이 바로 제작)
#
#   count        : 이번에 만들 영상 개수
#   start_index  : 이 번호 이후 소재만 처리 (PC에서 만든 옛 소재 건너뛰기)
#   auto_verify  : true면 미검증 소재를 팩트체크 없이 자동 승인 (기본 false)
#
# Secrets: GROQ_API_KEY (필수)
#          PIXABAY_API_KEY (장면 이미지, 없으면 색 카드로 대체)
#          YT_CLIENT_ID, YT_CLIENT_SECRET, YT_REFRESH_TOKEN (유튜브 업로드, 선택)
#          DISCORD_WEBHOOK_URL (완료/실패 알림 + 아티팩트 링크, 선택)

name: culture-shorts-pipeline

on:
  schedule:
    - cron: "0 9 * * *"   # UTC 기준 (한국 시간 = UTC+9)
  workflow_dispatch:
    inputs:
      redo:
        description: "이미 만든 영상 다시 제작할 DB 번호 (예: 98,99 / 비워두면 안 함)"
        default: ""
      redo_script:
        description: "대본부터 다시 만들 DB 번호 (예: 101 / 번호 뒤에 !를 붙이면(101!) 대본은 두고 검수 대기열로 되살림 / 비워두면 안 함)"
        default: ""
      stage:
        description: "단계 (prepare=대본/제목 준비, cuts=대본+이미지 컷 시트·후보 사진 시트(디스코드), render=영상 제작, all=한 번에)"
        type: choice
        options: [all, prepare, cuts, render]
        default: all
      count:
        description: "만들 영상 개수 (기본 3개, 하루 업로드 상한 20개)"
        default: "3"
      start_index:
        description: "이 번호 이후 소재만 처리 (PC에서 만든 옛 소재 건너뛰기)"
        default: "106"
      auto_verify:
        description: "미검증 소재 자동 승인 (팩트체크 생략)"
        type: boolean
        default: false
      pick:
        description: "후보 사진 고르기 (cuts 결과의 번호. 예: 117_3=2, 118_1=5 / 비우면 안 함). my_images에 저장되어 영상 제작 때 먼저 쓰임"
        default: ""
      cta_check:
        description: "대본의 구독/좋아요 문구 (off=안 함, scan=점검만, fix=미제작 소재 대본 다시 만들기)"
        type: choice
        options: ["off", "scan", "fix"]
        default: "off"

      cross_check:
        description: "대본 교차검증 (위키 근거 + 다른 모델 검증, 토큰 많이 씀. 기본 끔 - 직접 검증한 대본을 쓰는 방식)"
        type: boolean
        default: false

      voice:
        description: "목소리 (Supertonic: F1~F5 여성, M1~M5 남성 / 비우면 기본 F1)"
        default: ""
      speed:
        description: "말 속도 (예: -5% / +10% / 비우면 기본)"
        default: ""
      caption_mode:
        description: "자막 방식 (script=대본 자막 입힘, highlight=핵심 문구 표시(롱폼은 대본 자막), srt=SRT 파일만(영상엔 자막 없음), both=대본 자막+SRT)"
        type: choice
        options: [script, highlight, srt, both]
        default: script

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.event_name != 'schedule' || vars.AUTO_RUN != 'off' }}   # 저장소 변수 AUTO_RUN=off 로 자동 실행 일시 중지
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      STAGE: ${{ github.event.inputs.stage || 'all' }}
      PICK: ${{ github.event.inputs.pick || '' }}
      CROSS_CHECK: ${{ (github.event_name == 'schedule' || github.event.inputs.cross_check == 'true') && '1' || '0' }}
      PYTHONUNBUFFERED: "1"  # 로그가 실시간으로 보이게 함
      REDO: ${{ github.event.inputs.redo || '' }}
      REDO_SCRIPT: ${{ github.event.inputs.redo_script || '' }}
      COUNT: ${{ github.event.inputs.count || '3' }}
      START: ${{ github.event.inputs.start_index || '106' }}
      CTA_MODE: ${{ github.event.inputs.cta_check || 'off' }}
      SUPERTONIC_VOICE_KO: ${{ github.event.inputs.voice || '' }}
      CAPTION_MODE: ${{ github.event.inputs.caption_mode || 'script' }}
      TTS_RATE: ${{ github.event.inputs.speed || '' }}
      SFX: ${{ vars.SFX || 'off' }}             # 효과음 (기본 꺼짐, 켜려면 저장소 변수 SFX=on)
      SFX_VOL: ${{ vars.SFX_VOL || '1.0' }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 시스템 의존성 (ffmpeg, 한글 폰트)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - run: pip install -r requirements.txt

      # ---------- 검수 파일에서 고친 내용 반영 ----------
      - name: 성/민감 소재 제외 (아직 안 만든 소재)
        run: python exclude_sensitive.py

      - name: 나라와 주제가 안 맞는 소재 정리
        run: python check_country.py --apply

      - name: 직접 넣은 대본 인식 (facts_db.json에 대본을 넣은 소재)
        run: python promote_ready.py --start "$START"

      - name: review.txt 수정 사항 반영
        run: python apply_review.py

      - name: 고른 후보 사진 적용 (pick)
        if: ${{ env.PICK != '' }}
        run: python cuts.py --pick "$PICK"

      - name: 영상 다시 제작 대상 되돌리기 (선택)
        if: ${{ env.REDO != '' }}
        run: python redo_videos.py --indexes "$REDO"

      - name: 대본부터 다시 만들 대상 되돌리기 (선택)
        if: ${{ env.REDO_SCRIPT != '' }}
        run: python redo_videos.py --script --indexes "$REDO_SCRIPT"

      # ---------- 준비 단계 (prepare / all) ----------
      - name: 소재 보충 (대기 소재가 적을 때)
        if: ${{ env.STAGE != 'render' }}
        run: |
          python - <<'PY' > pending.txt
          import json, os
          db = json.load(open('facts_db.json', encoding='utf-8')) if os.path.exists('facts_db.json') else []
          print(sum(1 for f in db if f.get('status') in ('unverified', 'verified')))
          PY
          PENDING=$(cat pending.txt); echo "대기 소재: $PENDING"
          if [ "$PENDING" -lt 10 ]; then python generate_culture_facts.py --count 12 || echo "소재 보충 실패 - 이번 실행은 계속 진행합니다"; fi

      - name: 자동 승인 (선택)
        if: ${{ env.STAGE != 'render' && (github.event_name == 'schedule' || github.event.inputs.auto_verify == 'true') }}
        run: python approve.py --limit "$COUNT" --start "$START"

      - name: 구독/좋아요 문구 점검 (선택)
        if: ${{ env.CTA_MODE != 'off' }}
        run: |
          if [ "$CTA_MODE" = "fix" ]; then python reset_cta.py --start "$START" --apply; else python reset_cta.py --start "$START"; fi

      - name: 대본 + 제목 + 핵심 문구 + 이미지 검색어 생성
        if: ${{ env.STAGE != 'render' }}
        run: python generate_script.py --limit "$COUNT" --start "$START"

      - name: review.txt 만들기 (제목/핵심 문구 검수용)
        if: ${{ env.STAGE != 'render' }}
        run: python export_review.py --limit "$COUNT" --start "$START"

      - name: 이미지 컷 시트 + 후보 사진 시트 (cuts)
        if: ${{ env.STAGE == 'cuts' }}
        run: python cuts.py --shorts --limit "$COUNT" --start "$START"

      # ---------- 제작 단계 (render / all) ----------
      - name: 빠진 제목/핵심 문구/이미지 검색어 보충 (대본 기준)
        if: ${{ env.STAGE == 'render' }}
        run: python generate_script.py --extras-only --limit "$COUNT" --start "$START"

      - name: 음성(TTS)
        if: ${{ env.STAGE != 'prepare' && env.STAGE != 'cuts' }}
        run: python generate_tts.py --limit "$COUNT" --start "$START"

      - name: 장면 이미지 6장 (Pixabay)
        if: ${{ env.STAGE != 'prepare' && env.STAGE != 'cuts' }}
        run: python fetch_images.py --limit "$COUNT" --start "$START"

      - name: 영상 합성
        if: ${{ env.STAGE != 'prepare' && env.STAGE != 'cuts' }}
        run: python build_video.py --limit "$COUNT" --start "$START" --channel "${{ vars.CHANNEL_NAME || 'gonmauY' }}" --handle "@gonmauY"

      - name: 썸네일 만들기
        if: ${{ env.STAGE != 'prepare' && env.STAGE != 'cuts' }}
        run: python make_thumbnail.py --channel "${{ vars.CHANNEL_NAME || 'gonmauY' }}" --handle "@gonmauY"

      - name: 유튜브 비공개 업로드
        if: ${{ env.STAGE != 'prepare' && env.STAGE != 'cuts' && env.YT_REFRESH_TOKEN != '' }}
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          PUBLISH_SLOTS: ${{ vars.PUBLISH_SLOTS || 'off' }}   # 기본: 예약 없이 비공개로만 업로드 (예약 공개를 쓰려면 저장소 변수 PUBLISH_SLOTS=07:00,19:30 처럼 한국시간으로)
          YT_THUMBNAIL: ${{ vars.YT_THUMBNAIL || '' }}   # on 이면 썸네일도 자동 설정 (토큰을 새 권한으로 다시 발급해야 함)
        run: python upload_to_youtube.py --limit "$COUNT"

      # ---------- 저장 ----------
      - name: facts_db.json / review.txt 커밋
        run: |
          git config user.name "culture-shorts-bot"
          git config user.email "bot@users.noreply.github.com"
          git add facts_db.json
          [ -d my_images ] && git add my_images || true
          [ -f review.txt ] && git add review.txt || true
          git diff --cached --quiet || git commit -m "chore: update facts_db.json [skip ci]"
          # 실행 중에 다른 커밋(README 등)이 올라와도 push가 거절되지 않게 합친 뒤 올림
          for i in 1 2 3; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME:-main}" && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 3
          done
          echo "push 실패"; exit 1

      - name: 구글 드라이브 저장 (영상·음성·이미지·썸네일·자막)
        if: ${{ env.STAGE != 'prepare' && env.STAGE != 'cuts' }}
        continue-on-error: true
        env:
          DRIVE_CLIENT_ID: ${{ secrets.DRIVE_CLIENT_ID }}
          DRIVE_CLIENT_SECRET: ${{ secrets.DRIVE_CLIENT_SECRET }}
          DRIVE_REFRESH_TOKEN: ${{ secrets.DRIVE_REFRESH_TOKEN }}
        run: |
          if [ -n "$DRIVE_REFRESH_TOKEN" ]; then
            python drive_sync.py push --only thumbs,subs,audio,images,videos
          else
            echo "DRIVE_REFRESH_TOKEN Secret이 없어 드라이브 저장을 건너뜁니다."
          fi

      - name: 컷 시트·후보 사진 보관
        if: ${{ env.STAGE == 'cuts' }}
        uses: actions/upload-artifact@v4
        with:
          name: shorts-cuts
          path: cuts_out/*
          retention-days: 14
          if-no-files-found: warn

      - name: mp4 아티팩트 보관
        id: art
        if: ${{ env.STAGE != 'prepare' && env.STAGE != 'cuts' }}
        uses: actions/upload-artifact@v4
        with:
          name: culture-shorts-videos
          path: |
            videos/*.mp4
            videos/*.srt
            thumbnails/*.png
          retention-days: 14
          if-no-files-found: warn

      # ---------- 디스코드 알림 ----------
      - name: 디스코드 알림 (컷 시트·후보 사진)
        if: ${{ success() && env.STAGE == 'cuts' && env.DISCORD_WEBHOOK_URL != '' }}
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python notify_cuts.py

      - name: 디스코드 알림
        if: ${{ always() && (env.STAGE != 'cuts' || failure()) && env.DISCORD_WEBHOOK_URL != '' }}
        env:
          JOB_STATUS: ${{ job.status }}
          ART_URL: ${{ steps.art.outputs.artifact-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          START: ${{ github.event.inputs.start_index || '106' }}
          REVIEW_URL: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/review.txt
        run: python notify_discord.py

      # ---------- 작업 이력 (run_history.jsonl / run_history.md / history_items.csv) ----------
      - name: 작업 이력 기록
        if: ${{ always() }}
        continue-on-error: true
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python history.py add --kind "쇼츠" --title "${{ github.workflow }} #${{ github.run_number }}" --status "${{ job.status }}" --detail "$RUN_URL"
          git config user.name "culture-shorts-bot"
          git config user.email "bot@users.noreply.github.com"
          echo "run_history.jsonl merge=union" >> .git/info/attributes
          git add run_history.jsonl run_history.md history_items.csv
          git diff --cached --quiet || git commit -m "chore: run history [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash -X theirs origin "${GITHUB_REF_NAME:-main}" && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 4
          done
          exit 1

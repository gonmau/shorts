# 세계 문화 상식 쇼츠 - 클라우드 자동화 (아이폰에서 실행/검수)
#
# 아이폰: GitHub 앱(또는 Safari) > Actions > culture-shorts-pipeline > Run workflow
#
#   stage = prepare : 소재 -> 대본 -> 제목/핵심 문구/이미지 검색어 까지 만들고 review.txt 생성 (영상은 안 만듦)
#           -> 레포의 review.txt를 열어 제목/핵심 문구를 고치고 저장(Commit)
#   stage = render  : review.txt의 수정 사항을 반영해서 음성 -> 이미지 -> 영상(-> 유튜브 비공개 업로드)
#   stage = all     : 위 두 단계를 한 번에 (검수 없이 바로 제작)
#
#   count        : 이번에 만들 영상 개수
#   start_index  : 이 번호 이후 소재만 처리 (PC에서 만든 옛 소재 건너뛰기)
#   auto_verify  : true면 미검증 소재를 팩트체크 없이 자동 승인 (기본 false)
#
# Secrets: GROQ_API_KEY (필수)
#          PIXABAY_API_KEY (장면 이미지, 없으면 색 카드로 대체)
#          YT_CLIENT_ID, YT_CLIENT_SECRET, YT_REFRESH_TOKEN (유튜브 업로드, 선택)
#          DISCORD_WEBHOOK_URL (완료/실패 알림 + 아티팩트 링크, 선택)

name: culture-shorts-pipeline

on:
 # schedule:
 #   - cron: "0 21 * * 1,4"   # 월/목 06:00 KST (stage=all)
  workflow_dispatch:
    inputs:
      stage:
        description: "단계 (prepare=대본/제목 준비, render=영상 제작, all=한 번에)"
        type: choice
        options: [all, prepare, render]
        default: all
      count:
        description: "만들 영상 개수"
        default: "3"
      start_index:
        description: "이 번호 이후 소재만 처리 (PC에서 만든 옛 소재 건너뛰기)"
        default: "56"
      auto_verify:
        description: "미검증 소재 자동 승인 (팩트체크 생략)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      STAGE: ${{ github.event.inputs.stage || 'all' }}
      COUNT: ${{ github.event.inputs.count || '3' }}
      START: ${{ github.event.inputs.start_index || '56' }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 시스템 의존성 (ffmpeg, 한글 폰트)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - run: pip install -r requirements.txt

      # ---------- 검수 파일에서 고친 내용 반영 ----------
      - name: review.txt 수정 사항 반영
        run: python apply_review.py

      # ---------- 준비 단계 (prepare / all) ----------
      - name: 소재 보충 (대기 소재가 적을 때)
        if: ${{ env.STAGE != 'render' }}
        run: |
          python - <<'PY' > pending.txt
          import json, os
          db = json.load(open('facts_db.json', encoding='utf-8')) if os.path.exists('facts_db.json') else []
          print(sum(1 for f in db if f.get('status') in ('unverified', 'verified')))
          PY
          PENDING=$(cat pending.txt); echo "대기 소재: $PENDING"
          if [ "$PENDING" -lt 10 ]; then python generate_culture_facts.py --count 12; fi

      - name: 자동 승인 (선택)
        if: ${{ env.STAGE != 'render' && github.event.inputs.auto_verify == 'true' }}
        run: |
          python - <<'PY'
          import json, os
          n = int(os.environ['COUNT']); db = json.load(open('facts_db.json', encoding='utf-8')); k = 0
          for f in db:
              if f.get('status') == 'unverified' and k < n:
                  f['status'] = 'verified'; k += 1
          json.dump(db, open('facts_db.json', 'w', encoding='utf-8'), ensure_ascii=False, indent=2)
          print(f'{k}개 자동 승인')
          PY

      - name: 대본 + 제목 + 핵심 문구 + 이미지 검색어 생성
        if: ${{ env.STAGE != 'render' }}
        run: python generate_script.py --limit "$COUNT" --start "$START"

      - name: review.txt 만들기 (제목/핵심 문구 검수용)
        if: ${{ env.STAGE != 'render' }}
        run: python export_review.py --limit "$COUNT" --start "$START"

      # ---------- 제작 단계 (render / all) ----------
      - name: 음성(TTS)
        if: ${{ env.STAGE != 'prepare' }}
        run: python generate_tts.py --limit "$COUNT" --start "$START"

      - name: 장면 이미지 6장 (Pixabay)
        if: ${{ env.STAGE != 'prepare' }}
        run: python fetch_images.py --limit "$COUNT" --start "$START"

      - name: 영상 합성
        if: ${{ env.STAGE != 'prepare' }}
        run: python build_video.py --limit "$COUNT" --start "$START" --channel "${{ vars.CHANNEL_NAME || 'gonmauY' }}" --handle "@gonmauY"

      - name: 유튜브 비공개 업로드
        if: ${{ env.STAGE != 'prepare' && env.YT_REFRESH_TOKEN != '' }}
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
        run: python upload_to_youtube.py --limit "$COUNT"

      # ---------- 저장 ----------
      - name: facts_db.json / review.txt 커밋
        run: |
          git config user.name "culture-shorts-bot"
          git config user.email "bot@users.noreply.github.com"
          git add facts_db.json
          [ -f review.txt ] && git add review.txt || true
          git diff --cached --quiet || git commit -m "chore: update facts_db.json [skip ci]"
          git push

      - name: mp4 아티팩트 보관
        id: art
        if: ${{ env.STAGE != 'prepare' }}
        uses: actions/upload-artifact@v4
        with:
          name: culture-shorts-videos
          path: videos/*.mp4
          retention-days: 14
          if-no-files-found: warn

      # ---------- 디스코드 알림 ----------
      - name: 디스코드 알림
        if: ${{ always() && env.DISCORD_WEBHOOK_URL != '' }}
        env:
          JOB_STATUS: ${{ job.status }}
          ART_URL: ${{ steps.art.outputs.artifact-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REVIEW_URL: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/review.txt
        run: |
          python - <<'PY'
          import glob, json, os, urllib.request
          st, stage = os.environ["JOB_STATUS"], os.environ["STAGE"]
          vids = sorted(glob.glob("videos/*.mp4"))
          if st != "success":
              msg = f"❌ 쇼츠 파이프라인 실패 ({stage})\n로그: {os.environ['RUN_URL']}"
          elif stage == "prepare":
              msg = f"📝 준비 완료 - review.txt에서 제목/핵심 문구를 고친 뒤 render 실행\n{os.environ['REVIEW_URL']}\n실행: {os.environ['RUN_URL']}"
          else:
              art = os.environ.get("ART_URL") or os.environ["RUN_URL"]
              names = "\n".join("- " + v.split("/")[-1] for v in vids[:10]) or "(생성된 영상 없음)"
              msg = f"✅ 영상 {len(vids)}개 완료 ({stage})\n{names}\n다운로드(14일 보관): {art}\n실행: {os.environ['RUN_URL']}"
          req = urllib.request.Request(os.environ["DISCORD_WEBHOOK_URL"],
              data=json.dumps({"content": msg[:1900]}).encode(),
              headers={"Content-Type": "application/json", "User-Agent": "culture-shorts-bot"})
          try:
              urllib.request.urlopen(req, timeout=20)
          except Exception as e:
              print("디스코드 전송 실패:", e)
          PY

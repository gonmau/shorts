# 이미 유튜브에 올라간 영상(수동 업로드 포함)을 facts_db.json 의 '미업로드' 소재와 연결 + 공개 상태 새로 고침
# 수동 실행: Actions > culture-sync-uploads > Run workflow (dry=true 면 결과만 보고 저장 안 함)
# 필요: Secrets YT_CLIENT_ID, YT_CLIENT_SECRET, YT_REFRESH_TOKEN

name: culture-sync-uploads

on:
  workflow_dispatch:
    inputs:
      dry:
        description: "true면 결과만 확인하고 저장하지 않음"
        type: boolean
        default: false

# 같은 작업이 겹쳐 돌면 중복 생성·업로드될 수 있어 한 번에 하나만 실행 (겹치면 앞 실행이 끝날 때까지 대기)
concurrency:
  group: culture-sync-uploads
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUNBUFFERED: "1"
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      DRY: ${{ github.event.inputs.dry }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install google-api-python-client google-auth

      - name: 업로드 상태 연결
        run: |
          if [ "$DRY" = "true" ]; then python sync_uploads.py --dry; else python sync_uploads.py; fi

      - name: facts_db.json 커밋
        if: ${{ env.DRY != 'true' }}
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add facts_db.json
          git diff --cached --quiet || git commit -m "chore: sync upload status [skip ci]"
          B="${GITHUB_REF_NAME:-main}"
          cp facts_db.json /tmp/mine_db.json
          # 실행 중에 PC에서 올린 DB(폐기·대본 수정 등)를 덮어쓰지 않게 소재 단위로 병합한 뒤 올림
          for i in 1 2 3 4 5; do
            git fetch -q origin "$B" || { sleep 3; continue; }
            if git merge-base --is-ancestor "origin/$B" HEAD; then git push && exit 0; fi
            DB_CHANGED=1
            git diff --quiet "$(git merge-base HEAD "origin/$B")" "origin/$B" -- facts_db.json && DB_CHANGED=0
            git show "origin/$B:facts_db.json" > /tmp/theirs_db.json 2>/dev/null || DB_CHANGED=0
            git pull --rebase -X theirs origin "$B" || { git rebase --abort 2>/dev/null || true; sleep 3; continue; }
            if [ "$DB_CHANGED" = 1 ]; then
              python merge_remote_db.py /tmp/theirs_db.json /tmp/mine_db.json || true
              git add facts_db.json
              git diff --cached --quiet || git commit -q -m "chore: merge facts_db.json [skip ci]"
            fi
            git push && exit 0
            sleep 3
          done
          echo "push 실패"; exit 1

name: culture-thumbnail

# 업로드한 영상의 썸네일만 다시 만들어 그 영상에 바로 적용 (폰의 GitHub 앱에서 실행). 결과 이미지는 디스코드로도 전송.
# 배경 이미지는 영상 제작 때 저장한 thumb_bg/번호.jpg 를 씁니다 (이 기능 이후에 만든 영상부터. 없는 영상은 건너뜀).
on:
  workflow_dispatch:
    inputs:
      indexes:
        description: "소재 번호 (쉼표, 예: 495,496)"
        required: true
      font:
        description: "썸네일 글씨체 id (비우면 기본 설정). 예: blackhan, dohyeon"
        default: ""
      text1:
        description: "큰 글씨 1줄 (비우면 영상 제목 1줄)"
        default: ""
      text2:
        description: "큰 글씨 2줄 (비우면 영상 제목 2줄)"
        default: ""
      tag_text:
        description: "위쪽 태그 문구 (비우면 대본 훅 첫 문장)"
        default: ""
      apply:
        description: "유튜브에 바로 적용 (끄면 이미지만 만들어 디스코드로 보냄)"
        type: boolean
        default: true

concurrency:
  group: culture-thumbnail
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  thumb:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      CHANNEL_NAME: ${{ vars.CHANNEL_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 공유 설정 적용 (글씨체 등)
        run: python pipeline_settings.py --github-env >> "$GITHUB_ENV"
      - name: 썸네일 다시 만들기
        env:
          IDX: ${{ github.event.inputs.indexes }}
          FONT: ${{ github.event.inputs.font }}
          T1: ${{ github.event.inputs.text1 }}
          T2: ${{ github.event.inputs.text2 }}
          TAG: ${{ github.event.inputs.tag_text }}
          APPLY: ${{ github.event.inputs.apply }}
        run: |
          ARGS=(--indexes "$IDX" --font "$FONT" --text1 "$T1" --text2 "$T2" --tag-text "$TAG")
          [ "$APPLY" = "true" ] || ARGS+=(--no-upload)
          python thumb_redo.py "${ARGS[@]}"
